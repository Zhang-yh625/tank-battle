<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Tank Battle</title>
<style>
  :root {
    --bg: #0d0d14;
    --panel: #16161f;
    --text: #e8e8f0;
    --accent: #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .wrap {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .board {
    position: relative;
    background: #000;
    border: 3px solid #333;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    overflow: hidden;
  }
  canvas { display: block; }
  .panel {
    background: var(--panel);
    border: 1px solid #2a2a38;
    border-radius: 10px;
    padding: 20px 22px;
    min-width: 220px;
  }
  .panel h1 {
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .panel .sub { color: #888; font-size: 12px; margin-bottom: 18px; }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid #262632;
    font-size: 14px;
  }
  .stat span { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .enemy-left .icon { display: inline-block; width: 12px; height: 12px; background: #aab; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .btn {
    margin-top: 18px;
    width: 100%;
    padding: 11px;
    font-size: 15px;
    font-weight: 600;
    color: #111;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .help { margin-top: 18px; color: #999; font-size: 12px; line-height: 1.9; }
  .help b { color: #ddd; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,6,12,.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay h2 { font-size: 30px; color: var(--accent); letter-spacing: 3px; }
  .overlay p { color: #ccc; font-size: 14px; line-height: 1.8; }
  .hidden { display: none !important; }
  .touch {
    display: none;
    margin-top: 12px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .touch .row { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .touch button {
    width: 58px; height: 58px;
    font-size: 20px;
    background: #262633;
    color: #eee;
    border: 1px solid #3a3a4a;
    border-radius: 12px;
  }
  .touch button:active { background: var(--accent); color: #111; }
  .touch .fire { width: 72px; height: 72px; border-radius: 50%; background: #7a2230; font-size: 13px; }
  @media (pointer: coarse) {
    .touch { display: block; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="board">
      <canvas id="game"></canvas>

      <div id="overlay" class="overlay">
        <h2>坦克大战</h2>
        <p>
          方向键 / WASD 移动　·　空格 / J 射击<br>
          P 暂停　·　R 重新开始<br><br>
          保卫基地，消灭所有敌军！
        </p>
        <button class="btn" id="startBtn" style="width:auto;padding:12px 40px;">开始游戏</button>
      </div>

      <div class="touch" id="touch">
        <div class="row">
          <button data-k="ArrowUp">▲</button>
        </div>
        <div class="row">
          <button data-k="ArrowLeft">◀</button>
          <button data-k="ArrowDown">▼</button>
          <button data-k="ArrowRight">▶</button>
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="fire" data-k=" ">射击</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h1>坦克大战</h1>
      <div class="sub">BATTLE CITY · HTML5</div>

      <div class="stat">关卡 <span id="level">1</span></div>
      <div class="stat">得分 <span id="score">0</span></div>
      <div class="stat">生命 <span id="lives">3</span></div>
      <div class="stat enemy-left"><span class="icon"></span>剩余敌军 <span id="enemies">10</span></div>

      <button class="btn" id="restartBtn">重新开始</button>

      <div class="help">
        <b>移动</b>　方向键 / WASD<br>
        <b>射击</b>　空格 / J<br>
        <b>暂停</b>　P　　<b>重开</b>　R<br>
        <b>道具</b>　★火力升级 · 头盔护盾<br>
        　　　　炸弹清场 · 生命+1
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- 常量 ----------
  var TILE = 32, COLS = 13, ROWS = 13;
  var SIZE = 28;                 // 坦克尺寸（略小于格子）
  var PLAYER_SPEED = 132;        // px/s
  var ENEMY_SPEED = 82;
  var BULLET_SPEED = 340;
  var FAST_BULLET_SPEED = 460;

  var EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, GRASS = 4, BASE = 5;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  // ---------- 关卡地图（13×13）----------
  var LEVELS = [
    [
      ".............",
      ".............",
      ".#.#.#.#.#.#.",
      ".............",
      "..###...###..",
      "..S...G...S..",
      ".............",
      "..S...G...S..",
      "..###...###..",
      ".............",
      ".#.#.#.#.#.#.",
      "....#####....",
      ".....#B#....."
    ],
    [
      ".............",
      "~~...###...~~",
      "~~.#.S.S.#.~~",
      "~~...#.#...~~",
      "...###...###..",
      "....#.G.#.....",
      ".SS.......SS.",
      "....#.G.#.....",
      "...###...###..",
      "..S...G...S..",
      ".#.#.#.#.#.#.",
      "....#####....",
      ".....#B#....."
    ],
    [
      ".............",
      "SSS.....SSS..",
      "...S.S.S.S...",
      "..#.....#..#.",
      "~~.#.###.#.~~",
      "~~.#..#..#.~~",
      "..#..G.G..#..",
      "~~.#..#..#.~~",
      "~~.#.###.#.~~",
      "..#.....#..#.",
      "...S.S.S.S...",
      "....#####....",
      ".....#B#....."
    ]
  ];

  // 字符 → 地块
  function parseLevel(rows) {
    var g = [];
    for (var r = 0; r < ROWS; r++) {
      var row = rows[r];
      var arr = [];
      for (var c = 0; c < COLS; c++) {
        var ch = row[c];
        arr.push(ch === '#' ? BRICK : ch === 'S' ? STEEL : ch === '~' ? WATER :
                 ch === 'G' ? GRASS : ch === 'B' ? BASE : EMPTY);
      }
      g.push(arr);
    }
    return g;
  }

  // ---------- 状态 ----------
  var grid, tanks, bullets, effects, powerups;
  var player;
  var score, lives, level, enemiesLeft, enemiesAlive, totalEnemies;
  var state;                 // menu / playing / levelclear / gameover / win
  var base = { alive: true, x: 0, y: 0 };
  var spawnTimer = 0, levelClearTimer = 0, shake = 0;

  var keys = Object.create(null);
  var audioCtx = null;

  // 敌军类型
  var ENEMY_TYPES = {
    basic: { hp: 1, speed: 82,  color: '#aab2c0', score: 100, bullet: BULLET_SPEED },
    fast:  { hp: 1, speed: 128, color: '#5fd0c0', score: 200, bullet: BULLET_SPEED },
    power: { hp: 1, speed: 92,  color: '#f0a048', score: 300, bullet: FAST_BULLET_SPEED },
    armor: { hp: 4, speed: 62,  color: '#7fc06a', score: 400, bullet: BULLET_SPEED }
  };

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  var DIRS = [
    { dx: 0, dy: -1, name: 'up' },
    { dx: 1, dy: 0,  name: 'right' },
    { dx: 0, dy: 1,  name: 'down' },
    { dx: -1, dy: 0, name: 'left' }
  ];

  // ---------- 声音 ----------
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime;
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxShoot() { beep(440, 0.08, 'square', 0.04); }
  function sfxHit() { beep(160, 0.12, 'sawtooth', 0.06); }
  function sfxBoom() { beep(90, 0.35, 'sawtooth', 0.09); }
  function sfxPower() { beep(660, 0.1, 'square', 0.05); setTimeout(function(){beep(880,0.12,'square',0.05);},90); }
  function sfxBase() { beep(60, 0.6, 'sawtooth', 0.12); }

  function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }

  // ---------- 碰撞：坦克能否占据某矩形 ----------
  function tileAt(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return STEEL; // 边界视为墙
    return grid[row][col];
  }
  function solidForTank(t) { return t === BRICK || t === STEEL || t === WATER || t === BASE; }

  function canOccupy(x, y, w, h) {
    var c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
    var r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
    for (var r = r0; r <= r1; r++)
      for (var c = c0; c <= c1; c++)
        if (solidForTank(tileAt(c, r))) return false;
    return true;
  }

  // 坦克之间碰撞（返回 true 表示会撞到别的坦克）
  function hitsTank(self, x, y) {
    var r = { x: x, y: y, w: SIZE, h: SIZE };
    for (var i = 0; i < tanks.length; i++) {
      var t = tanks[i];
      if (t === self || !t.alive) continue;
      if (rectOverlap(r, { x: t.x, y: t.y, w: SIZE, h: SIZE })) return true;
    }
    return false;
  }

  function tryMove(t, dx, dy) {
    // 分轴移动，允许贴墙滑动
    t.blocked = false;
    if (dx !== 0) {
      var nx = t.x + dx;
      if (nx < 0) nx = 0;
      if (nx + SIZE > canvas.width) nx = canvas.width - SIZE;
      if (canOccupy(nx, t.y, SIZE, SIZE) && !hitsTank(t, nx, t.y)) t.x = nx;
      else t.blocked = true;
    }
    if (dy !== 0) {
      var ny = t.y + dy;
      if (ny < 0) ny = 0;
      if (ny + SIZE > canvas.height) ny = canvas.height - SIZE;
      if (canOccupy(t.x, ny, SIZE, SIZE) && !hitsTank(t, t.x, ny)) t.y = ny;
      else t.blocked = true;
    }
  }

  // ---------- 生成坦克 ----------
  function makeTank(col, row, dir, isPlayer, type) {
    var x = col * TILE + (TILE - SIZE) / 2;
    var y = row * TILE + (TILE - SIZE) / 2;
    var conf = type ? ENEMY_TYPES[type] : null;
    return {
      x: x, y: y, dir: dir, isPlayer: isPlayer, alive: true,
      speed: isPlayer ? PLAYER_SPEED : conf.speed,
      hp: conf ? conf.hp : 1,
      type: type, color: conf ? conf.color : '#f5c542',
      score: conf ? conf.score : 0,
      bulletSpeed: conf ? conf.bullet : BULLET_SPEED,
      power: isPlayer ? 1 : 0,
      shootCd: 0, aiTimer: rand(0.8, 2.5), blocked: false,
      invincibleUntil: 0, flash: 0
    };
  }

  function spawnPlayer() {
    player = makeTank(4, ROWS - 1, 0 /* up */, true);
    player.invincibleUntil = now() + 3; // 重生护盾
    tanks.push(player);
  }

  function spawnEnemy() {
    var cols = [0, 6, 12];
    var col = choice(cols);
    var types = ['basic', 'basic', 'basic', 'fast', 'power', 'armor'];
    var type = choice(types);
    var e = makeTank(col, 0, 2 /* down */, false, type);
    tanks.push(e);
    enemiesAlive++;
    return e;
  }

  // ---------- 子弹 ----------
  function fire(t) {
    if (!t.alive) return;
    if (t.shootCd > 0) return;
    var mine = 0;
    for (var i = 0; i < bullets.length; i++) if (bullets[i].owner === t) mine++;
    var maxBullets = t.isPlayer ? playerPower() : 1;
    if (mine >= maxBullets) return;
    var d = DIRS[t.dir];
    var bx = t.x + SIZE / 2 - 3 + d.dx * SIZE / 2;
    var by = t.y + SIZE / 2 - 3 + d.dy * SIZE / 2;
    bullets.push({ x: bx, y: by, dir: t.dir, owner: t, speed: t.bulletSpeed, w: 6, h: 6 });
    t.shootCd = t.isPlayer ? 0.28 : rand(0.8, 1.6);
    sfxShoot();
  }

  function playerPower() { return player ? player.power : 1; }

  // ---------- 道具 ----------
  var POWER_NAMES = ['star', 'helmet', 'grenade', 'life'];
  function dropPower(x, y) {
    if (powerups.length > 0) return;
    if (Math.random() > 0.22) return;
    var name = choice(POWER_NAMES);
    powerups.push({ x: x, y: y, name: name, age: 0 });
  }

  function applyPower(p) {
    sfxPower();
    if (p.name === 'star') {
      player.power = Math.min(3, player.power + 1);
    } else if (p.name === 'helmet') {
      player.invincibleUntil = now() + 10;
    } else if (p.name === 'grenade') {
      for (var i = 0; i < tanks.length; i++) {
        var t = tanks[i];
        if (!t.isPlayer && t.alive) { killEnemy(t); }
      }
    } else if (p.name === 'life') {
      lives++;
    }
  }

  // ---------- 击杀 / 计分 ----------
  function killEnemy(e) {
    e.alive = false;
    e.hp = 0;
    score += e.score;
    enemiesAlive--;
    enemiesLeft--;
    addEffect(e.x + SIZE / 2, e.y + SIZE / 2, e.color);
    sfxBoom();
    dropPower(e.x, e.y);
  }

  function addEffect(x, y, color) {
    effects.push({ x: x, y: y, age: 0, life: 0.4, color: color || '#f5c542' });
  }

  function destroyBase() {
    base.alive = false;
    sfxBase();
    shake = 0.5;
    addEffect(base.x * TILE + TILE / 2, base.y * TILE + TILE / 2, '#f55');
    state = 'gameover';
    showOverlay('游戏结束', '基地被摧毁了！<br>得分：<b>' + score + '</b>');
  }

  // ---------- 初始化关卡 ----------
  function loadLevel(n) {
    grid = parseLevel(LEVELS[(n - 1) % LEVELS.length]);
    tanks = [];
    bullets = [];
    effects = [];
    powerups = [];
    enemiesAlive = 0;
    enemiesLeft = 10 + n * 2;      // 每关敌军数
    totalEnemies = enemiesLeft;
    spawnTimer = 1.2;
    base.alive = true;

    // 定位基地
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        if (grid[r][c] === BASE) { base.x = c; base.y = r; }

    spawnPlayer();
    state = 'playing';
  }

  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    score = 0; lives = 3; level = 1;
    loadLevel(level);
    hideOverlay();
  }

  function nextLevel() {
    level++;
    loadLevel(level);
  }

  // ---------- 输入 ----------
  var KEYDIR = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyP' && state === 'playing') state = 'paused';
    else if (e.code === 'KeyP' && state === 'paused') state = 'playing';
    if (e.code === 'KeyR') startGame();
  });
  document.addEventListener('keyup', function (e) { keys[e.code] = false; });

  // 触屏按钮
  document.querySelectorAll('#touch button').forEach(function (b) {
    var k = b.getAttribute('data-k');
    function down(e) { e.preventDefault(); keys[k === ' ' ? 'Space' : k] = true; initAudio(); }
    function up(e) { e.preventDefault(); keys[k === ' ' ? 'Space' : k] = false; }
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('pointercancel', up);
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
  function showOverlay(title, text) {
    var o = document.getElementById('overlay');
    o.classList.remove('hidden');
    o.querySelector('h2').textContent = title;
    o.querySelector('p').innerHTML = text;
  }

  // ---------- 更新时间基准 ----------
  function now() { return performance.now() / 1000; }
  var last = now();

  // ---------- 更新 ----------
  function update(dt) {
    if (state !== 'playing' && state !== 'respawn') return;

    // 玩家输入
    var moved = false;
    if (player && player.alive) {
      for (var code in KEYDIR) {
        if (keys[code]) {
          player.dir = KEYDIR[code];
          moved = true;
          break;
        }
      }
      if (moved) {
        var d = DIRS[player.dir];
        player.blocked = false;
        tryMove(player, d.dx * player.speed * dt, d.dy * player.speed * dt);
      }
      if (keys['Space'] || keys['KeyJ']) fire(player);
      player.shootCd -= dt;
    }

    // 敌军 AI
    for (var i = 0; i < tanks.length; i++) {
      var e = tanks[i];
      if (e.isPlayer || !e.alive) continue;
      e.aiTimer -= dt;
      e.blocked = false;
      if (e.aiTimer <= 0) {
        e.aiTimer = rand(1, 3);
        e.dir = Math.random() < 0.42 ? 2 : randi(0, 3); // 偏向向下推进
      }
      var ed = DIRS[e.dir];
      tryMove(e, ed.dx * e.speed * dt, ed.dy * e.speed * dt);
      if (e.blocked) { e.dir = randi(0, 3); e.aiTimer = rand(0.3, 1.2); }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && Math.random() < 0.03) fire(e);
    }

    // 敌军生成
    if (enemiesLeft > 0 && enemiesAlive < 4) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = rand(1.5, 3); }
    }

    // 子弹
    for (var b = 0; b < bullets.length; b++) {
      var bl = bullets[b];
      var bd = DIRS[bl.dir];
      bl.x += bd.dx * bl.speed * dt;
      bl.y += bd.dy * bl.speed * dt;
      var dead = false;

      // 出界
      if (bl.x < 0 || bl.y < 0 || bl.x + bl.w > canvas.width || bl.y + bl.h > canvas.height) dead = true;

      // 命中地块
      if (!dead) {
        var cc = Math.floor((bl.x + bl.w / 2) / TILE);
        var rr = Math.floor((bl.y + bl.h / 2) / TILE);
        var tile = tileAt(cc, rr);
        if (tile === BRICK) {
          grid[rr][cc] = EMPTY;
          addEffect(cc * TILE + TILE / 2, rr * TILE + TILE / 2, '#c96');
          sfxHit();
          dead = true;
        } else if (tile === STEEL) {
          addEffect(bl.x, bl.y, '#fff');
          dead = true;
        } else if (tile === BASE) {
          destroyBase();
          dead = true;
        }
        // WATER / GRASS：子弹穿过
      }

      // 命中坦克
      if (!dead) {
        var br = { x: bl.x, y: bl.y, w: bl.w, h: bl.h };
        for (var t = 0; t < tanks.length && !dead; t++) {
          var tk = tanks[t];
          if (!tk.alive) continue;
          if (bl.owner === tk) continue;
          if (bl.owner.isPlayer === tk.isPlayer) continue; // 同阵营不伤害
          if (rectOverlap(br, { x: tk.x, y: tk.y, w: SIZE, h: SIZE })) {
            if (tk.isPlayer) {
              if (now() < tk.invincibleUntil) { /* 护盾挡下 */ }
              else playerDie();
            } else {
              tk.hp--;
              addEffect(bl.x, bl.y, '#fff');
              sfxHit();
              if (tk.hp <= 0) killEnemy(tk);
            }
            dead = true;
          }
        }
      }

      if (dead) { bullets.splice(b, 1); b--; }
    }

    // 道具
    for (var p = 0; p < powerups.length; p++) {
      var pu = powerups[p];
      pu.age += dt;
      if (player && player.alive && rectOverlap(
        { x: pu.x - 8, y: pu.y - 8, w: 16, h: 16 },
        { x: player.x, y: player.y, w: SIZE, h: SIZE })) {
        applyPower(pu);
        powerups.splice(p, 1); p--;
      } else if (pu.age > 10) {
        powerups.splice(p, 1); p--;
      }
    }

    // 特效
    for (var f = 0; f < effects.length; f++) {
      effects[f].age += dt;
      if (effects[f].age > effects[f].life) { effects.splice(f, 1); f--; }
    }

    if (shake > 0) shake -= dt;

    // 关卡通关判定
    if (enemiesLeft <= 0 && enemiesAlive <= 0 && state === 'playing') {
      state = 'levelclear';
      levelClearTimer = 2.2;
    }

    // 玩家阵亡后的重生
    if (state === 'playing' && player && !player.alive) {
      // 由 playerDie 处理重生延迟
    }

    updateHUD();
  }

  var respawnTimer = 0;
  function playerDie() {
    player.alive = false;
    addEffect(player.x + SIZE / 2, player.y + SIZE / 2, '#f5c542');
    sfxBoom();
    shake = 0.4;
    lives--;
    if (lives < 0) { state = 'gameover'; showOverlay('游戏结束', '基地被摧毁或生命耗尽<br>得分：<b>' + score + '</b>'); return; }
    respawnTimer = 1.5;
    state = 'respawn';
  }

  function tick(dt) {
    if (state === 'respawn') {
      respawnTimer -= dt;
      if (respawnTimer <= 0) { spawnPlayer(); state = 'playing'; }
    } else if (state === 'levelclear') {
      levelClearTimer -= dt;
      if (levelClearTimer <= 0) {
        if (level >= LEVELS.length) {
          state = 'win';
          showOverlay('胜利！', '你完成了全部关卡！<br>最终得分：<b>' + score + '</b>');
        } else {
          nextLevel();
        }
      }
    }
  }

  // ---------- HUD ----------
  function updateHUD() {
    document.getElementById('level').textContent = level;
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = Math.max(0, lives);
    document.getElementById('enemies').textContent = Math.max(0, enemiesLeft);
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-3, 3), rand(-3, 3));

    // 背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    // 道具
    for (var i = 0; i < powerups.length; i++) drawPower(powerups[i]);

    // 坦克
    for (var j = 0; j < tanks.length; j++) if (tanks[j].alive) drawTank(tanks[j]);

    // 子弹
    ctx.fillStyle = '#fff';
    for (var k = 0; k < bullets.length; k++) {
      var b = bullets[k];
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    // 特效
    for (var f = 0; f < effects.length; f++) drawEffect(effects[f]);

    ctx.restore();

    // 状态文字
    if (state === 'levelclear') {
      drawCenterText('关卡 ' + level + ' 完成！');
    } else if (state === 'paused') {
      drawCenterText('已暂停', '#aaa');
    }
  }

  function drawCenterText(text, color) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, canvas.height / 2 - 24, canvas.width, 48);
    ctx.fillStyle = color || '#f5c542';
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    ctx.restore();
  }

  function drawGrid() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = grid[r][c];
        var x = c * TILE, y = r * TILE;
        if (t === BRICK) drawBrick(x, y);
        else if (t === STEEL) drawSteel(x, y);
        else if (t === WATER) drawWater(x, y);
        else if (t === GRASS) drawGrass(x, y);
        else if (t === BASE) drawEagle(x, y);
      }
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = '#8a4a2a';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#b55a30';
    ctx.fillRect(x, y, TILE, TILE / 2);
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
    // 砖缝
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(x, y + TILE / 2 - 1, TILE, 2);
    ctx.fillRect(x + TILE / 4, y, 2, TILE / 2);
    ctx.fillRect(x + TILE * 3 / 4, y, 2, TILE / 2);
    ctx.fillRect(x + TILE / 2, y + TILE / 2, 2, TILE / 2);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = '#9aa4b2';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#c8d0da';
    ctx.fillRect(x, y, TILE, TILE / 2);
    ctx.strokeStyle = '#5a6470';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = '#6a7480';
    ctx.fillRect(x + TILE / 2 - 2, y + 4, 4, TILE - 8);
  }

  function drawWater(x, y) {
    var t = performance.now() / 1000;
    ctx.fillStyle = '#1b4d8a';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = '#3f86c8';
    ctx.lineWidth = 2;
    for (var i = 0; i < 2; i++) {
      var yy = y + ((t * 20 + i * TILE / 2) % TILE);
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + TILE / 3, yy - 4);
      ctx.lineTo(x + TILE * 2 / 3, yy + 4);
      ctx.lineTo(x + TILE, yy);
      ctx.stroke();
    }
  }

  function drawGrass(x, y) {
    ctx.fillStyle = '#3c7a3c';
    ctx.fillRect(x, y, TILE, TILE);
  }

  function drawEagle(x, y) {
    ctx.fillStyle = '#333';
    ctx.fillRect(x, y, TILE, TILE);
    var cx = x + TILE / 2, cy = y + TILE / 2;
    if (base.alive) {
      // 老鹰
      ctx.fillStyle = '#f5c542';
      ctx.beginPath();
      ctx.arc(cx, cy - 2, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e89b2c';
      ctx.beginPath();
      ctx.arc(cx, cy - 2, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8a5a20';
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy - 1);
      ctx.lineTo(cx, cy + 3);
      ctx.lineTo(cx + 4, cy - 1);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 1.5, cy - 6, 3, 3);
    } else {
      // 被毁
      ctx.fillStyle = '#888';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✕', cx, cy + 5);
    }
  }

  function drawTank(t) {
    var x = t.x, y = t.y, s = SIZE;
    var invincible = t.invincibleUntil > now();
    var color = t.color;

    // 装甲坦克闪烁
    if (t.type === 'armor' && t.hp > 1 && Math.floor(now() * 6) % 2 === 0) color = '#a7e08f';

    ctx.save();
    ctx.translate(x + s / 2, y + s / 2);
    ctx.rotate(t.dir * Math.PI / 2);

    // 履带
    ctx.fillStyle = '#333';
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = '#555';
    ctx.fillRect(-s / 2, -s / 2, 6, s);
    ctx.fillRect(s / 2 - 6, -s / 2, 6, s);

    // 履带纹理
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    for (var i = -s / 2 + 2; i < s / 2; i += 6) {
      ctx.fillRect(-s / 2 + 1, i, 4, 3);
      ctx.fillRect(s / 2 - 5, i, 4, 3);
    }

    // 车身
    ctx.fillStyle = color;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-s / 2 + 5, -s / 2 + 5, s - 10, s - 10, 4);
    else ctx.rect(-s / 2 + 5, -s / 2 + 5, s - 10, s - 10);
    ctx.fill();

    // 炮管（朝上）
    ctx.fillStyle = color;
    ctx.fillRect(-3, -s / 2 - 4, 6, s / 2 - 3);

    // 炮塔高光
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(-s / 2 + 7, -s / 2 + 7, s - 14, 4);

    ctx.restore();

    // 护盾光环
    if (invincible) {
      ctx.save();
      ctx.strokeStyle = 'rgba(140,220,255,' + (0.5 + 0.3 * Math.sin(now() * 10)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x + s / 2, y + s / 2, s / 2 + 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 装甲坦克的血量标记
    if (t.type === 'armor') {
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(x + 2, y - 4, s - 4, 3);
      ctx.fillStyle = '#7fe06a';
      ctx.fillRect(x + 2, y - 4, (s - 4) * (t.hp / 4), 3);
    }
  }

  function drawPower(p) {
    var x = p.x, y = p.y;
    var blink = Math.floor(now() * 4) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 1 : 0.55;
    var colors = { star: '#f5c542', helmet: '#7fd0f0', grenade: '#f06050', life: '#7fe06a' };
    ctx.fillStyle = colors[p.name] || '#fff';
    ctx.fillRect(x - 10, y - 10, 20, 20);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 10, y - 10, 20, 20);
    ctx.fillStyle = '#111';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var sym = { star: '★', helmet: '◉', grenade: '✹', life: '+1' };
    ctx.fillText(sym[p.name], x, y + 1);
    ctx.restore();
  }

  function drawEffect(e) {
    var k = e.age / e.life;
    var r = 6 + k * 22;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- 主循环 ----------
  function frame(ts) {
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    if (state !== 'menu') {
      tick(dt);
      update(dt);
    }
    render();
    updateHUD();
    requestAnimationFrame(frame);
  }

  // 初始进入菜单
  state = 'menu';
  grid = parseLevel(LEVELS[0]);
  base.alive = true;
  score = 0; lives = 3; level = 1; enemiesLeft = 0; enemiesAlive = 0;
  tanks = []; bullets = []; effects = []; powerups = [];
  requestAnimationFrame(frame);

  window.addEventListener('blur', function () {
    if (state === 'playing') state = 'paused';
  });
})();
</script>
</body>
</html>
